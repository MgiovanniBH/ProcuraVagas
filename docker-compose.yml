services:
  pesquisa-vagas:
    image: pesquisa-vagas:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pesquisa-vagas
    restart: unless-stopped
    ports:
      - "7860:7860"
      - "8001:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - JOBVIS_HOST=0.0.0.0
    volumes:
      - ./data:/app/data
